[build]
  command = "npm run build"
  publish = "dist"
  # Firebase *client* config is public by design (it ships in the JS
  # bundle); omit it from secrets scanning. Real secrets (OPENAI_API_KEY)
  # stay scanned.
  environment = { SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID", SECRETS_SCAN_OMIT_PATHS = "dist/**" }

[functions]
  directory = "netlify/functions"

# API redirect must come before the SPA catch-all (redirect order matters).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
