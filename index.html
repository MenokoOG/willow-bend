<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Willow Bend Family Clinic | Family Medicine in Meridian, ID</title>
    <meta name="description"
        content="Willow Bend Family Clinic provides family medicine in Meridian, ID. Respectful, human-centered care for every member of the family, focused on long-term health." />

    <!-- This will be updated at runtime by ThemeToggle, but keep a safe default -->
    <meta name="theme-color" content="#a8e0f0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=VT323&display=swap"
        rel="stylesheet" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Canonical (update domain after Netlify deploy) -->
    <link rel="canonical" href="https://willowbendclinic.example/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Willow Bend Family Clinic | Family Medicine in Meridian, ID" />
    <meta property="og:description"
        content="Respectful, human-centered family-practice care for every member of the family, focused on long-term health." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://willowbendclinic.example/" />
    <meta property="og:image" content="https://willowbendclinic.example/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Voxel-art illustration of Willow Bend Family Clinic with a garden and a green medical cross on the roof." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://willowbendclinic.example/og-image.png" />
    <meta name="twitter:title" content="Willow Bend Family Clinic" />
    <meta name="twitter:description" content="Respectful, human-centered family medicine in Meridian, ID." />
</head>

<!-- IMPORTANT: no Tailwind bg/text classes here. Theme is driven by CSS variables. -->

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
